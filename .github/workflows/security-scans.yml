name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  security-scans:
    name: Run Security Scans
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit checkov

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.3"

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Run Bandit SAST scan
        run: |
          bandit -r app -f json -o reports/sast.bandit.json || true

      - name: Run Python dependency scan
        run: |
          pip-audit -r requirements.txt -f json > reports/sca.pip-audit.json || true

      - name: Render Helm chart
        run: |
          helm template vulntracker helm > reports/rendered-kubernetes.yaml

      - name: Run Checkov IaC scan
        run: |
          checkov -f reports/rendered-kubernetes.yaml --framework kubernetes --output json > reports/iac.checkov.json || true

      - name: Build Docker image
        run: docker build -t vulntracker-api:local .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vulntracker-api:local
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: reports/*.json
          if-no-files-found: warn
