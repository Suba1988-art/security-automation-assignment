# Requires External Secrets Operator and an AWS Secrets Manager SecretStore named aws-secrets.
# Create the SecretStore separately with workload identity/IRSA; do not commit AWS credentials.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vulntracker-app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: vulntracker-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef:
        key: prod/vulntracker
        property: SECRET_KEY
    - secretKey: database-url
      remoteRef:
        key: prod/vulntracker
        property: DATABASE_URL
