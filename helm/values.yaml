replicaCount: 2

image:
  repository: ghcr.io/suba1988-art/vulntracker-api
  tag: "1.0.0"
  pullPolicy: Always

service:
  port: 8000

ingress:
  enabled: false
  className: nginx
  host: vulntracker.example.com
  tlsSecret: vulntracker-tls

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
